services:
  - type: web
    name: boukkuk-api
    runtime: docker
    plan: free
    healthCheckPath: /up
    initialDeployHook: php artisan db:seed --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: boukkuk-db
          property: connectionString

databases:
  - name: boukkuk-db
    plan: free
    databaseName: boukkuk
    user: boukkuk
